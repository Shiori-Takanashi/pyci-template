[project]
name = "pyci-template"
version = "0.1.0"
description = "Python template for code quality and CI using uv."
readme = "README.md"
authors = [
    { name = "Takanashi", email = "tnbirds314@gmail.com" }
]
requires-python = "==3.15.*"
dependencies = []

[build-system]
requires = ["uv_build==0.13.*"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.*",
]

[tool.uv]
required-version = "==0.13.*"
